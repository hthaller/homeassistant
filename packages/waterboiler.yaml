###########################################################################################################
# BOILER
###########################################################################################################

homeassistant:
  name: Boiler

# === TEMPLATE NUMBER ===
template:
  - number:
      - name: "Boiler Level"
        unique_id: boiler_level
        min: 0
        max: 3
        step: 1
        icon: mdi:water-boiler
        set_value:
          service: script.set_boiler_level
          data:
            level: "{{ value | int }}"
        state: >
          {% set switches = [
            'switch.shellypro3_switch_0',
            'switch.shellypro3_switch_1',
            'switch.shellypro3_switch_2'
          ] %}
          {{ switches | select('is_state', 'on') | list | count }}

  - sensor:
      - name: "Boiler Info"
        unique_id: boiler_info
        state: "{{ states('number.boiler_level') }}"
        attributes:
          switch_0_hours: "{{ states('sensor.switch_0_duration') | float(0) | round(1) }}"
          switch_1_hours: "{{ states('sensor.switch_1_duration') | float(0) | round(1) }}"
          switch_2_hours: "{{ states('sensor.switch_2_duration') | float(0) | round(1) }}"

# === HISTORY STATS SENSOR (Betriebszeiten) ===
sensor:
  - platform: history_stats
    name: Switch 0 Duration
    entity_id: switch.shellypro3_switch_0
    state: "on"
    type: time
    duration:
      days: 365
    end: "{{ now() }}"

  - platform: history_stats
    name: Switch 1 Duration
    entity_id: switch.shellypro3_switch_1
    state: "on"
    type: time
    duration:
      days: 365
    end: "{{ now() }}"

  - platform: history_stats
    name: Switch 2 Duration
    entity_id: switch.shellypro3_switch_2
    state: "on"
    type: time
    duration:
      days: 365
    end: "{{ now() }}"

# === SCRIPT ===
script:
  set_boiler_level:
    description: "Steuere Boiler-Schalter abhängig von Laufzeit"
    mode: single
    fields:
      level:
        description: "Boiler-Level (0–3)"
        example: 2
    sequence:
      - variables:
          lvl: "{{ level | int(default=-1) }}"

      - variables:
          switches: >
            {% set data = [
              {
                'id': 'switch.shellypro3_switch_0',
                'duration': states('sensor.switch_0_duration') | float(0),
                'state': is_state('switch.shellypro3_switch_0', 'on')
              },
              {
                'id': 'switch.shellypro3_switch_1',
                'duration': states('sensor.switch_1_duration') | float(0),
                'state': is_state('switch.shellypro3_switch_1', 'on')
              },
              {
                'id': 'switch.shellypro3_switch_2',
                'duration': states('sensor.switch_2_duration') | float(0),
                'state': is_state('switch.shellypro3_switch_2', 'on')
              }
            ] %}
            {{ data }}

          current_on: "{{ switches | selectattr('state', 'equalto', true) | list }}"
          desired_on_count: "{{ lvl }}"
          delta: "{{ lvl - (current_on | length) }}"
          sorted_on: "{{ switches | sort(attribute='duration') }}"
          sorted_off: "{{ switches | sort(attribute='duration', reverse=true) }}"

      - condition: template
        value_template: "{{ 0 <= lvl <= 3 }}"

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ delta > 0 }}"
            sequence:
              - repeat:
                  count: "{{ delta }}"
                  sequence:
                    - variables:
                        next_switch: >
                          {{
                            (sorted_on | rejectattr('state', 'equalto', true) | list)[repeat.index - 1].id
                          }}
                    - service: switch.turn_on
                      target:
                        entity_id: "{{ next_switch }}"

          - conditions:
              - condition: template
                value_template: "{{ delta < 0 }}"
            sequence:
              - repeat:
                  count: "{{ (-1 * delta) }}"
                  sequence:
                    - variables:
                        next_switch: >
                          {{
                            (sorted_off | selectattr('state', 'equalto', true) | list)[repeat.index - 1].id
                          }}
                    - service: switch.turn_off
                      target:
                        entity_id: "{{ next_switch }}"


  set_boiler_manual:
    alias: "Boiler manuell setzen"
    description: "Setzt die Boiler-Stufe manuell und deaktiviert Automatik"
    mode: single
    fields:
      level:
        description: "Boiler-Stufe: 0=Aus, 1=3kW, 2=6kW, 3=9kW"
        example: 1
    sequence:
      # Boiler-Level setzen
      - service: number.set_value
        target:
          entity_id: number.boiler_level
        data:
          value: "{{ level | int }}"
      # Automatik deaktivieren
      - service: automation.turn_off
        target:
          entity_id: automation.boiler

automation:
  - alias: Boiler
    id: boiler_automation
    description: "Automatische Regelung des Boiler-Levels basierend auf Netzexport und Batteriestatus"
    trigger:
      - platform: time_pattern
        minutes: "/5"  # alle 5 Minuten prüfen
    condition: []
    action:
      - choose:
          # --- Erhöhe Boiler-Stufe ---
          - conditions:
              - condition: numeric_state
                entity_id: sensor.grid_export_average_5min
                above: 9500     # Überschuss > 9,5 kW
              - condition: numeric_state
                entity_id: number.boiler_level
                below: 3        # Nur erhöhen, wenn noch nicht auf Max
              - condition: or
                conditions:
                  - condition: numeric_state
                    entity_id: sensor.solax_battery_total_capacity_charge
                    above: 90   # Batterie fast voll
                  - condition: numeric_state
                    entity_id: sensor.solax_battery_power_charge
                    above: 9500 # Batterie lädt stark
            sequence:
              - service: number.set_value
                target:
                  entity_id: number.boiler_level
                data:
                  value: >
                    {% set current = states('number.boiler_level') | int(0) %}
                    {{ [current + 1, 3] | min }}

          # --- Reduziere Boiler-Stufe ---
          - conditions:
              - condition: numeric_state
                entity_id: number.boiler_level
                above: 0
              - condition: or
                conditions:
                  - condition: numeric_state
                    entity_id: sensor.grid_export_average_5min
                    below: 6500  # Wenig Überschuss
                  - condition: and
                    conditions:
                      - condition: numeric_state
                        entity_id: sensor.solax_battery_total_capacity_charge
                        below: 90
                      - condition: numeric_state
                        entity_id: sensor.solax_battery_power_charge
                        below: 7000
            sequence:
              - service: number.set_value
                target:
                  entity_id: number.boiler_level
                data:
                  value: >
                    {% set current = states('number.boiler_level') | int(0) %}
                    {{ [current - 1, 0] | max }}
    mode: single
                        
